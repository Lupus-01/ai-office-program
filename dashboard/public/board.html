<!doctype html>
<html lang="ko" data-theme="calm">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="office-token" content="__OFFICE_TOKEN__">
  <meta name="color-scheme" content="dark light">
  <title>현황판 · AI Office</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%2338bdf8%22/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="board.css">
</head>
<body class="board-body">
  <header class="bd-top">
    <a class="btn btn-sm btn-ghost bd-back" href="./" aria-label="대화 화면으로 돌아가기">‹ 대화</a>
    <h1>현황판</h1>
    <nav class="bd-tabs" aria-label="현황판 화면"><a class="is-on" href="board.html" aria-current="page">챙길 것</a><a href="sales.html">매출</a></nav>
    <p class="bd-sub" id="bdSub">지금 챙길 것만 모아 보여 줍니다. 챙긴 건은 "확인함"으로 접어 두세요.</p>
    <form class="bd-manager" id="bdManagerForm" autocomplete="off">
      <label for="bdManager">담당자</label>
      <input id="bdManager" list="bdManagers" maxlength="40" placeholder="본인 이름" required>
      <datalist id="bdManagers"></datalist>
      <button type="submit" class="btn btn-sm" id="bdManagerSave">저장</button>
    </form>
    <button type="button" class="btn btn-sm bd-run" id="bdRun">지금 확인</button>
  </header>
  <p class="bd-notice" id="bdNotice" role="status" hidden></p>
  <main id="bdMain" class="bd-main" aria-live="polite"></main>
  <script type="module" src="board.js"></script>
</body>
</html>
